<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
const [page, target, extra, fw] = location.hash.slice(1).split(",");
const f = document.getElementById("f"); f.src = page + "?v=" + Date.now(); if (fw) { f.style.width = fw + "px"; f.style.height = "1600px"; }
f.addEventListener("load", () => {
  const d = f.contentDocument, w = f.contentWindow;
  d.documentElement.style.scrollBehavior = "auto";
  const st = d.createElement("style"); st.textContent = "#nerves{transition:none!important;opacity:1!important;filter:none!important}[data-reveal],[data-reveal-group]>*{opacity:1!important;transform:none!important}"; d.head.appendChild(st);
  const go = () => { const el = target && target !== "top" ? d.getElementById(target) : null;
    w.scrollTo(0, (el ? el.getBoundingClientRect().top + w.scrollY - 60 : 0) + (+extra || 0)); };
  setTimeout(go, 300); setTimeout(go, 1200); setTimeout(go, 3000);
});
</script></body></html>
